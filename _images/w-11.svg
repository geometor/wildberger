    </g>
    <g class="points-layer">
    <g class="element-group" data-ref="A_1"><circle class="Point given golden" cx="0.6180" cy="-0.7862" r="0.0411" data-latex-xy="(- \frac{1}{2} + \frac{\sqrt{5}}{2}, - \frac{\sqrt{\frac{1}{2} + \frac{\sqrt{5}}{2}}}{2} + \frac{\sqrt{5} \sqrt{\frac{1}{2} + \frac{\sqrt{5}}{2}}}{2})" data-exact-xy="[-1/2 + sqrt(5)/2, -sqrt(1/2 + sqrt(5)/2)/2 + sqrt(5)*sqrt(1/2 + sqrt(5)/2)/2]"><title>A_1 = [-1/2 + sqrt(5)/2, -sqrt(1/2 + sqrt(5)/2)/2 + sqrt(5)*sqrt(1/2 + sqrt(5)/2)/2]</title></circle></g>
    <g class="element-group" data-ref="A_2"><circle class="Point given" cx="0.0000" cy="-0.0000" r="0.0411" data-latex-xy="(0, 0)" data-exact-xy="[0, 0]"><title>A_2 = [0, 0]</title></circle></g>
    <g class="element-group" data-ref="A_3"><circle class="Point given golden" cx="1.6180" cy="-0.0000" r="0.0411" data-latex-xy="(\phi, 0)" data-exact-xy="[GoldenRatio, 0]"><title>A_3 = [GoldenRatio, 0]</title></circle></g>
    <g class="element-group" data-ref="F_1"><circle class="Point foot golden" cx="0.6180" cy="-0.0000" r="0.0321" data-latex-xy="(- \frac{1}{2} + \frac{\sqrt{5}}{2}, 0)" data-exact-xy="[-1/2 + sqrt(5)/2, 0]"><title>F_1 = [-1/2 + sqrt(5)/2, 0]</title></circle></g>
    </g>
    <g class="callouts-layer">
    <g class="element-group" data-ref="t_kepler"><rect class="callout-box" x="0.0152" y="0.2015" width="1.5697" height="0.0970" /><text class="callout-text" x="0.8000" y="0.2500" font-size="0.0626">Q = (1, phi, phi^2), F_1 splits phi : 1</text></g>
    <g class="element-group" data-ref="A_1"><rect class="callout-box spread-box" x="-0.1401" y="-0.9985" width="1.8801" height="0.0970" /><text class="callout-text" x="0.8000" y="-0.9500" font-size="0.0626">s = (2 - phi, phi - 1, 1) = (1/phi^2, 1/phi, 1)</text></g>
