    <g class="element-group" data-ref="A_2"><text class="label-halo" x="0.0530" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" stroke="#111318" stroke-width="0.0201" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">2</tspan></text><text class="label-fill" x="0.0530" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">2</tspan></text></g>
    <g class="element-group" data-ref="A_3"><text class="label-halo" x="1.6710" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" stroke="#111318" stroke-width="0.0201" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="1.6710" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
    <g class="element-group" data-ref="F_1"><text class="label-halo" x="0.6710" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" stroke="#111318" stroke-width="0.0201" stroke-linejoin="round" fill="none">F<tspan dy="0.3em" font-size="74%">1</tspan></text><text class="label-fill" x="0.6710" y="-0.0465" font-family="sans-serif" font-size="0.0802" font-weight="600" fill="#f0f4f8">F<tspan dy="0.3em" font-size="74%">1</tspan></text></g>
    </g>
