    <g class="element-group" data-ref="A_3"><circle class="Point given" cx="4.0000" cy="-3.0000" r="0.2465" data-latex-xy="(4, 3)" data-exact-xy="[4, 3]"><title>A_3 = [4, 3]</title></circle></g>
    <g class="element-group" data-ref="A_4"><circle class="Point given" cx="3.0000" cy="4.0000" r="0.2465" data-latex-xy="(3, -4)" data-exact-xy="[3, -4]"><title>A_4 = [3, -4]</title></circle></g>
