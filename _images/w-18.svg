    <g class="element-group" data-ref="A_4"><text class="label-halo" x="3.3178" y="3.7208" font-family="sans-serif" font-size="0.4814" font-weight="600" stroke="#111318" stroke-width="0.1204" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">4</tspan></text><text class="label-fill" x="3.3178" y="3.7208" font-family="sans-serif" font-size="0.4814" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">4</tspan></text></g>
