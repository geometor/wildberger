    <g class="svg-control-btn" data-action="zoom-out"><rect x="2.3551" y="-7.9749" width="1.0624" height="0.6854" /><text x="2.8863" y="-7.6322" style="font-size:0.3084px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="3.5409" y="-7.9749" width="1.0624" height="0.6854" /><text x="4.0721" y="-7.6322" style="font-size:0.3084px">⟲</text></g>
