    <g class="element-group" data-ref="A_1"><text class="label-halo" x="-4.6822" y="-0.2792" font-family="sans-serif" font-size="0.4814" font-weight="600" stroke="#111318" stroke-width="0.1204" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">1</tspan></text><text class="label-fill" x="-4.6822" y="-0.2792" font-family="sans-serif" font-size="0.4814" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">1</tspan></text></g>
    <g class="element-group" data-ref="A_2"><text class="label-halo" x="-2.6822" y="-4.2792" font-family="sans-serif" font-size="0.4814" font-weight="600" stroke="#111318" stroke-width="0.1204" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">2</tspan></text><text class="label-fill" x="-2.6822" y="-4.2792" font-family="sans-serif" font-size="0.4814" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">2</tspan></text></g>
