    <g class="element-group" data-ref="A_0"><text class="label-halo" x="2.2648" y="-6.2327" font-family="sans-serif" font-size="0.4012" font-weight="600" stroke="#111318" stroke-width="0.1003" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">0</tspan></text><text class="label-fill" x="2.2648" y="-6.2327" font-family="sans-serif" font-size="0.4012" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">0</tspan></text></g>
