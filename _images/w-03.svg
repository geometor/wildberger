    <g class="svg-control-btn" data-action="zoom-out"><rect x="4.7959" y="-7.6458" width="0.8854" height="0.5712" /><text x="5.2386" y="-7.3602" style="font-size:0.2570px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="5.7841" y="-7.6458" width="0.8854" height="0.5712" /><text x="6.2267" y="-7.3602" style="font-size:0.2570px">⟲</text></g>
