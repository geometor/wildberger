    <g class="element-group" data-ref="P_0"><text class="label-halo" x="0.0636" y="-1.0558" font-family="sans-serif" font-size="0.0963" font-weight="600" stroke="#111318" stroke-width="0.0241" stroke-linejoin="round" fill="none">P<tspan dy="0.3em" font-size="74%">0</tspan></text><text class="label-fill" x="0.0636" y="-1.0558" font-family="sans-serif" font-size="0.0963" font-weight="600" fill="#f0f4f8">P<tspan dy="0.3em" font-size="74%">0</tspan></text></g>
    <g class="element-group" data-ref="P_1"><text class="label-halo" x="1.0146" y="-0.3649" font-family="sans-serif" font-size="0.0963" font-weight="600" stroke="#111318" stroke-width="0.0241" stroke-linejoin="round" fill="none">P<tspan dy="0.3em" font-size="74%">1</tspan></text><text class="label-fill" x="1.0146" y="-0.3649" font-family="sans-serif" font-size="0.0963" font-weight="600" fill="#f0f4f8">P<tspan dy="0.3em" font-size="74%">1</tspan></text></g>
    <g class="element-group" data-ref="P_2"><text class="label-halo" x="0.6513" y="0.7532" font-family="sans-serif" font-size="0.0963" font-weight="600" stroke="#111318" stroke-width="0.0241" stroke-linejoin="round" fill="none">P<tspan dy="0.3em" font-size="74%">2</tspan></text><text class="label-fill" x="0.6513" y="0.7532" font-family="sans-serif" font-size="0.0963" font-weight="600" fill="#f0f4f8">P<tspan dy="0.3em" font-size="74%">2</tspan></text></g>
    <g class="element-group" data-ref="P_3"><text class="label-halo" x="-0.5242" y="0.7532" font-family="sans-serif" font-size="0.0963" font-weight="600" stroke="#111318" stroke-width="0.0241" stroke-linejoin="round" fill="none">P<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="-0.5242" y="0.7532" font-family="sans-serif" font-size="0.0963" font-weight="600" fill="#f0f4f8">P<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
    <g class="element-group" data-ref="P_4"><text class="label-halo" x="-0.8875" y="-0.3649" font-family="sans-serif" font-size="0.0963" font-weight="600" stroke="#111318" stroke-width="0.0241" stroke-linejoin="round" fill="none">P<tspan dy="0.3em" font-size="74%">4</tspan></text><text class="label-fill" x="-0.8875" y="-0.3649" font-family="sans-serif" font-size="0.0963" font-weight="600" fill="#f0f4f8">P<tspan dy="0.3em" font-size="74%">4</tspan></text></g>
