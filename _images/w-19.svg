    <g class="element-group" data-ref="pent"><polygon class="Polygon golden" points="0.0000,-1.0000 0.9511,-0.3090 0.5878,0.8090 -0.5878,0.8090 -0.9511,-0.3090"><title>pent</title></polygon></g>
