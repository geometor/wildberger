    <g class="element-group" data-ref="P_0"><circle class="Point given golden" cx="0.0000" cy="-1.0000" r="0.0493" data-latex-xy="(0, 1)" data-exact-xy="[0, 1]"><title>P_0 = [0, 1]</title></circle></g>
    <g class="element-group" data-ref="P_1"><circle class="Point golden" cx="0.9511" cy="-0.3090" r="0.0385" data-latex-xy="(\frac{\sqrt{2} \sqrt{\sqrt{5} + 5}}{4}, - \frac{1}{4} + \frac{\sqrt{5}}{4})" data-exact-xy="[sqrt(2)*sqrt(sqrt(5) + 5)/4, -1/4 + sqrt(5)/4]"><title>P_1 = [sqrt(2)*sqrt(sqrt(5) + 5)/4, -1/4 + sqrt(5)/4]</title></circle></g>
    <g class="element-group" data-ref="P_2"><circle class="Point golden" cx="0.5878" cy="0.8090" r="0.0385" data-latex-xy="(\frac{\sqrt{2} \sqrt{5 - \sqrt{5}}}{4}, - \frac{\sqrt{5}}{4} - \frac{1}{4})" data-exact-xy="[sqrt(2)*sqrt(5 - sqrt(5))/4, -sqrt(5)/4 - 1/4]"><title>P_2 = [sqrt(2)*sqrt(5 - sqrt(5))/4, -sqrt(5)/4 - 1/4]</title></circle></g>
    <g class="element-group" data-ref="P_3"><circle class="Point golden" cx="-0.5878" cy="0.8090" r="0.0385" data-latex-xy="(- \frac{\sqrt{2} \sqrt{5 - \sqrt{5}}}{4}, - \frac{\sqrt{5}}{4} - \frac{1}{4})" data-exact-xy="[-sqrt(2)*sqrt(5 - sqrt(5))/4, -sqrt(5)/4 - 1/4]"><title>P_3 = [-sqrt(2)*sqrt(5 - sqrt(5))/4, -sqrt(5)/4 - 1/4]</title></circle></g>
    <g class="element-group" data-ref="P_4"><circle class="Point golden" cx="-0.9511" cy="-0.3090" r="0.0385" data-latex-xy="(- \frac{\sqrt{2} \sqrt{\sqrt{5} + 5}}{4}, - \frac{1}{4} + \frac{\sqrt{5}}{4})" data-exact-xy="[-sqrt(2)*sqrt(sqrt(5) + 5)/4, -1/4 + sqrt(5)/4]"><title>P_4 = [-sqrt(2)*sqrt(sqrt(5) + 5)/4, -1/4 + sqrt(5)/4]</title></circle></g>
    </g>
    <g class="callouts-layer">
    <g class="element-group" data-ref="pent"><rect class="callout-box" x="-0.8021" y="-1.2582" width="1.6042" height="0.1164" /><text class="callout-text" x="0.0000" y="-1.2000" font-size="0.0751">Q_diag / Q_side = phi^2 = phi + 1</text></g>
    <g class="element-group" data-ref="star"><rect class="callout-box spread-box" x="-0.9185" y="1.1418" width="1.8371" height="0.1164" /><text class="callout-text" x="0.0000" y="1.2000" font-size="0.0751">s_diag = (3-phi)/4, s_side = (2+phi)/4</text></g>
