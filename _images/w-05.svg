    <g class="svg-control-btn" data-action="zoom-out"><rect x="1.0641" y="-13.9389" width="1.5810" height="1.0200" /><text x="1.8546" y="-13.4289" style="font-size:0.4590px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="2.8287" y="-13.9389" width="1.5810" height="1.0200" /><text x="3.6192" y="-13.4289" style="font-size:0.4590px">⟲</text></g>
