    <g class="element-group" data-ref="F_3"><circle class="Point foot" cx="1.4400" cy="-1.9200" r="0.0843" data-latex-xy="(\frac{36}{25}, \frac{48}{25})" data-exact-xy="[36/25, 48/25]"><title>F_3 = [36/25, 48/25]</title></circle></g>
