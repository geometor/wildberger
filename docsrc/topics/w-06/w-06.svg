    <g class="element-group" data-ref="A_2"><text class="label-halo" x="4.1390" y="-0.1222" font-family="sans-serif" font-size="0.2106" font-weight="600" stroke="#111318" stroke-width="0.0527" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">2</tspan></text><text class="label-fill" x="4.1390" y="-0.1222" font-family="sans-serif" font-size="0.2106" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">2</tspan></text></g>
    <g class="element-group" data-ref="A_3"><text class="label-halo" x="0.1390" y="-0.1222" font-family="sans-serif" font-size="0.2106" font-weight="600" stroke="#111318" stroke-width="0.0527" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="0.1390" y="-0.1222" font-family="sans-serif" font-size="0.2106" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
    <g class="element-group" data-ref="M_3"><text class="label-halo" x="2.1390" y="-1.6222" font-family="sans-serif" font-size="0.2106" font-weight="600" stroke="#111318" stroke-width="0.0527" stroke-linejoin="round" fill="none">M<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="2.1390" y="-1.6222" font-family="sans-serif" font-size="0.2106" font-weight="600" fill="#f0f4f8">M<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
    <g class="element-group" data-ref="F_3"><text class="label-halo" x="1.5790" y="-2.0422" font-family="sans-serif" font-size="0.2106" font-weight="600" stroke="#111318" stroke-width="0.0527" stroke-linejoin="round" fill="none">F<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="1.5790" y="-2.0422" font-family="sans-serif" font-size="0.2106" font-weight="600" fill="#f0f4f8">F<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
