    </g>
    <g class="points-layer">
    <g class="element-group" data-ref="A_1"><circle class="Point given" cx="0.0000" cy="-3.0000" r="0.1078" data-latex-xy="(0, 3)" data-exact-xy="[0, 3]"><title>A_1 = [0, 3]</title></circle></g>
    <g class="element-group" data-ref="A_2"><circle class="Point given" cx="4.0000" cy="-0.0000" r="0.1078" data-latex-xy="(4, 0)" data-exact-xy="[4, 0]"><title>A_2 = [4, 0]</title></circle></g>
