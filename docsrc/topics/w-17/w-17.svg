    <g class="element-group" data-ref="P_1"><circle class="Point given" cx="-3.0000" cy="-4.0000" r="0.2568" data-latex-xy="(-3, 4)" data-exact-xy="[-3, 4]"><title>P_1 = [-3, 4]</title></circle></g>
