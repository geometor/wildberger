    <g class="svg-control-btn" data-action="zoom-out"><rect x="4.7449" y="-7.0572" width="1.1067" height="0.7140" /><text x="5.2982" y="-6.7002" style="font-size:0.3213px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="5.9801" y="-7.0572" width="1.1067" height="0.7140" /><text x="6.5334" y="-6.7002" style="font-size:0.3213px">⟲</text></g>
