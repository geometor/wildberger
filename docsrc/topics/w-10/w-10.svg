    <g class="element-group" data-ref="l_2"><line class="Line " x1="-8.9443" y1="17.8885" x2="8.9443" y2="-17.8885"><title>l_2</title></line></g>
    <g class="element-group" data-ref="l_3"><line class="Line " x1="-19.8456" y1="2.4807" x2="19.8456" y2="-2.4807"><title>l_3</title></line></g>
    </g>
    <g class="points-layer">
    <g class="element-group" data-ref="A_1"><circle class="Point given" cx="0.0000" cy="-0.0000" r="0.1643" data-latex-xy="(0, 0)" data-exact-xy="[0, 0]"><title>A_1 = [0, 0]</title></circle></g>
    <g class="element-group" data-ref="A_2"><circle class="Point given" cx="8.0000" cy="-1.0000" r="0.1643" data-latex-xy="(8, 1)" data-exact-xy="[8, 1]"><title>A_2 = [8, 1]</title></circle></g>
    <g class="element-group" data-ref="A_3"><circle class="Point given" cx="3.0000" cy="-6.0000" r="0.1643" data-latex-xy="(3, 6)" data-exact-xy="[3, 6]"><title>A_3 = [3, 6]</title></circle></g>
    </g>
    <g class="callouts-layer">
    <g class="element-group" data-ref="t"><rect class="callout-box spread-box" x="2.0247" y="-2.6940" width="3.9505" height="0.3880" /><text class="callout-text" x="4.0000" y="-2.5000" font-size="0.2503">s = (9/13, 81/130, 9/10)</text></g>
    <g class="element-group" data-ref="l_3"><rect class="callout-box" x="0.3174" y="0.8060" width="7.3653" height="0.3880" /><text class="callout-text" x="4.0000" y="1.0000" font-size="0.2503">(s_1+s_2+s_3)^2 = 2*sum(s_i^2) + 4*s_1*s_2*s_3</text></g>
