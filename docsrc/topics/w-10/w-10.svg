    <g class="element-group" data-ref="A_2"><text class="label-halo" x="8.2118" y="-1.1862" font-family="sans-serif" font-size="0.3210" font-weight="600" stroke="#111318" stroke-width="0.0802" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">2</tspan></text><text class="label-fill" x="8.2118" y="-1.1862" font-family="sans-serif" font-size="0.3210" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">2</tspan></text></g>
    <g class="element-group" data-ref="A_3"><text class="label-halo" x="3.2118" y="-6.1862" font-family="sans-serif" font-size="0.3210" font-weight="600" stroke="#111318" stroke-width="0.0802" stroke-linejoin="round" fill="none">A<tspan dy="0.3em" font-size="74%">3</tspan></text><text class="label-fill" x="3.2118" y="-6.1862" font-family="sans-serif" font-size="0.3210" font-weight="600" fill="#f0f4f8">A<tspan dy="0.3em" font-size="74%">3</tspan></text></g>
    </g>
