<svg xmlns="http://www.w3.org/2000/svg" class="wildberger-diagram" viewBox="-2.8800 -6.8800 21.7600 13.7600">
  <style>
svg.wildberger-diagram {
    background-color: #111318;
    border: 1px solid #2e3440;
    border-radius: 6px;
    width: 100%;
    height: auto;
    max-height: 560px;
    display: block;
    margin: 0.6rem auto;
    user-select: none;
    overflow: hidden;
    cursor: grab;
}
svg.wildberger-diagram:active {
    cursor: grabbing;
}
@media (prefers-color-scheme: light) {
    svg.wildberger-diagram {
        background-color: #fbfbfd;
        border-color: #d8dee9;
    }
    svg.wildberger-diagram .Point {
        stroke: #fbfbfd !important;
    }
    svg.wildberger-diagram .Point.given {
        fill: #1a1d24 !important;
    }
    svg.wildberger-diagram .label-halo {
        stroke: #fbfbfd !important;
    }
    svg.wildberger-diagram .label-fill {
        fill: #1a1d24 !important;
    }
    svg.wildberger-diagram .Line,
    svg.wildberger-diagram .Segment {
        stroke: #4c566a;
    }
    svg.wildberger-diagram .callout-box {
        fill: rgba(255, 255, 255, 0.90);
    }
    svg.wildberger-diagram .callout-text {
        fill: #1a1d24;
    }
}
.Line, .Segment {
    stroke: #9aa5b4;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.3px;
    fill: none;
    opacity: 0.82;
    transition: stroke-width 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
}
.Circle, .Curve {
    stroke: #c678dd;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.45px;
    fill: none;
    opacity: 0.86;
    transition: stroke-width 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
}
.Polygon {
    fill: rgba(97, 175, 239, 0.09);
    stroke: #61afef;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.85px;
    stroke-linejoin: round;
    transition: stroke-width 0.15s ease, fill-opacity 0.15s ease;
}
.Polygon.golden {
    fill: rgba(229, 192, 123, 0.14);
    stroke: #e5c07b;
}
.Point {
    fill: #e5c07b;
    stroke: #111318;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.4px;
    transition: r 0.15s ease, filter 0.15s ease;
}
.Point.given {
    fill: #ffffff;
}
.Point.focus, .Point.center, .Point.target {
    fill: #00e5ff;
}
.Point.golden {
    fill: #f0c674;
}
.Point.midpoint, .Point.foot {
    fill: #98c379;
}
.Point.metric-blue, .Line.metric-blue, .Segment.metric-blue, .Circle.metric-blue {
    stroke: #61afef;
}
.Point.metric-blue {
    fill: #61afef;
}
.Point.metric-red, .Line.metric-red, .Segment.metric-red, .Circle.metric-red, .Curve.metric-red {
    stroke: #e06c75;
}
.Point.metric-red {
    fill: #e06c75;
}
.Point.metric-green, .Line.metric-green, .Segment.metric-green, .Circle.metric-green, .Curve.metric-green {
    stroke: #98c379;
}
.Point.metric-green {
    fill: #98c379;
}
.Line.guide, .Circle.guide, .Segment.guide, .Curve.guide {
    stroke-dasharray: 4 4;
    opacity: 0.44;
    stroke-width: 0.95px;
}
.Line.euler, .Segment.euler, .Line.axis, .Segment.axis {
    stroke: #e06c75;
    stroke-width: 1.85px;
    opacity: 0.92;
}
.Line.altitude, .Segment.altitude, .Line.median, .Segment.median, .Line.bisector, .Segment.bisector {
    stroke: #98c379;
    stroke-width: 1.45px;
    opacity: 0.88;
}
.Line.golden, .Segment.golden, .Circle.golden, .Curve.golden {
    stroke: #e5c07b;
    stroke-width: 1.8px;
}
.Circle.circumcircle {
    stroke: #e06c75;
    stroke-width: 1.55px;
}
.Circle.ninepoint {
    stroke: #61afef;
    stroke-width: 1.65px;
}
.Circle.incircle {
    stroke: #e5c07b;
    stroke-width: 1.55px;
}
.callout-box {
    fill: rgba(24, 28, 36, 0.86);
    stroke: #61afef;
    vector-effect: non-scaling-stroke;
    stroke-width: 1px;
}
.callout-box.spread-box {
    stroke: #e5c07b;
    rx: 3px;
}
.callout-text {
    fill: #eceff4;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
}
.element-group {
    cursor: pointer;
}
.element-group.svg-hovered .Line,
.element-group.svg-hovered .Segment,
.element-group.svg-hovered .Circle,
.element-group.svg-hovered .Curve,
.element-group.svg-hovered .Polygon {
    stroke: #00e5ff !important;
    stroke-width: 2.8px !important;
    opacity: 1.0 !important;
    filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.75));
}
.element-group.svg-hovered .Point {
    fill: #00e5ff !important;
    filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.9));
}
.geom-ref {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    padding: 0.05em 0.3em;
    border-radius: 3px;
    background: rgba(97, 175, 239, 0.14);
    color: #61afef;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
}
.geom-ref:hover, .geom-ref.ref-hovered {
    background: #00e5ff;
    color: #111318;
}
.svg-control-btn {
    cursor: pointer;
}
.svg-control-btn rect {
    fill: rgba(30, 34, 42, 0.85);
    stroke: #5c6370;
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
    rx: 3px;
}
.svg-control-btn:hover rect {
    fill: rgba(55, 62, 76, 0.95);
    stroke: #00e5ff;
}
.svg-control-btn text {
    fill: #e5e9f0;
    font-family: sans-serif;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
}
svg.hide-labels .labels-layer,
svg.hide-labels .callouts-layer {
    display: none;
}
svg.hide-guides .guide {
    display: none;
}
</style>
